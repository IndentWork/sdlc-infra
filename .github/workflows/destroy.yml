name: SDLC Infra Destroy

# Manually triggered — select environment and scope before running.
# Strategy: delete the resource group directly via az, then clean Terraform state.
# This bypasses the notoriously slow azurerm_postgresql_flexible_server_active_directory_administrator
# delete (30-90+ min via ARM). Total destroy time: ~5 min instead of 30+.
#
# WARNING: This will permanently delete all Azure resources for the selected scope.
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - DEV
          - PROD
      scope:
        description: "Scope to destroy — 'base', 'shared', or a dedicated tenant resource_code (e.g. a3f1c2b4)"
        required: true
        type: string
        default: "base"

jobs:
  plan-destroy:
    name: "Plan Destroy (${{ inputs.env }} / ${{ inputs.scope }})"
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_ID_TERRAFORM', inputs.env)] }}
      ARM_CLIENT_SECRET:   ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_SECRET_TERRAFORM', inputs.env)] }}
      ARM_TENANT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_TENANT_ID_TERRAFORM', inputs.env)] }}
      ARM_SUBSCRIPTION_ID: ${{ secrets[format('SDLC_{0}_AZURE_SUBSCRIPTION_ID_TERRAFORM', inputs.env)] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Set lowercase env
        run: echo "ENV_LOWER=$(echo '${{ inputs.env }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: environments
        run: |
          terraform init \
            -backend-config="key=${{ inputs.scope }}.tfstate"

      - name: List resources to be destroyed
        working-directory: environments
        run: |
          echo "=== Resources in Terraform state ==="
          terraform state list
          echo ""
          echo "=== Resource group to be deleted ==="
          echo "rg-sdlc-${{ inputs.scope }}-${{ env.ENV_LOWER }}"

  destroy:
    name: "Destroy (${{ inputs.env }} / ${{ inputs.scope }})"
    needs: plan-destroy
    runs-on: ubuntu-latest

    environment: apply

    env:
      ARM_CLIENT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_ID_TERRAFORM', inputs.env)] }}
      ARM_CLIENT_SECRET:   ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_SECRET_TERRAFORM', inputs.env)] }}
      ARM_TENANT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_TENANT_ID_TERRAFORM', inputs.env)] }}
      ARM_SUBSCRIPTION_ID: ${{ secrets[format('SDLC_{0}_AZURE_SUBSCRIPTION_ID_TERRAFORM', inputs.env)] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Set lowercase env
        run: echo "ENV_LOWER=$(echo '${{ inputs.env }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: environments
        run: |
          terraform init \
            -backend-config="key=${{ inputs.scope }}.tfstate"

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Force delete resource groups
        run: |
          RG="rg-sdlc-${{ inputs.scope }}-${{ env.ENV_LOWER }}"

          if az group show --name "$RG" --output none 2>/dev/null; then
            echo "Deleting $RG..."
            az group delete --name "$RG" --yes --output none
            echo "$RG deleted"
          else
            echo "$RG does not exist — skipping"
          fi

          # Container Apps auto-creates a companion ME_* resource group — delete if present
          orphans=$(az group list --query "[?starts_with(name, 'ME_cae-sdlc-${{ inputs.scope }}-${{ env.ENV_LOWER }}')].name" -o tsv)
          if [ -n "$orphans" ]; then
            for orphan in $orphans; do
              echo "Deleting orphan: $orphan"
              az group delete --name "$orphan" --yes --output none
            done
          else
            echo "No orphan ME_* resource groups"
          fi

      - name: Clean Terraform state
        working-directory: environments
        run: |
          echo "=== Resources to remove from state ==="
          terraform state list

          echo ""
          echo "=== Removing each resource from state ==="
          terraform state list | while read -r resource; do
            echo "Removing: $resource"
            terraform state rm "$resource" || true
          done

          echo ""
          echo "=== Final state (should be empty) ==="
          terraform state list || echo "State is empty"
