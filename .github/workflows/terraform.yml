name: SDLC Infra Terraform

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: choice
        options:
          - DEV
          - PROD
      scope:
        description: "Scope — 'base', 'shared', or a dedicated tenant resource_code (e.g. a3f1c2b4)"
        required: true
        type: string
        default: "base"

jobs:
  plan:
    name: "Terraform Plan (${{ inputs.env }} / ${{ inputs.scope }})"
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_ID_TERRAFORM', inputs.env)] }}
      ARM_CLIENT_SECRET:   ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_SECRET_TERRAFORM', inputs.env)] }}
      ARM_TENANT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_TENANT_ID_TERRAFORM', inputs.env)] }}
      ARM_SUBSCRIPTION_ID: ${{ secrets[format('SDLC_{0}_AZURE_SUBSCRIPTION_ID_TERRAFORM', inputs.env)] }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Set env vars
        run: |
          echo "ENV_LOWER=$(echo '${{ inputs.env }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          if [ "${{ inputs.scope }}" = "base" ] || [ "${{ inputs.scope }}" = "shared" ]; then
            echo "SCOPE_DIR=${{ inputs.scope }}" >> $GITHUB_ENV
          else
            echo "SCOPE_DIR=dedicated" >> $GITHUB_ENV
          fi

      - name: Terraform Init
        working-directory: environments/scope/${{ env.SCOPE_DIR }}
        run: terraform init -backend-config="key=${{ inputs.scope }}.tfstate"

      - name: Terraform Plan
        working-directory: environments/scope/${{ env.SCOPE_DIR }}
        run: |
          if [ "${{ inputs.scope }}" = "base" ]; then
            terraform plan \
              -var-file="../../env/${{ env.ENV_LOWER }}/base.tfvars" \
              -out=tfplan
          else
            terraform plan \
              -var-file="../../env/${{ env.ENV_LOWER }}/common.tfvars" \
              -var-file="../../env/${{ env.ENV_LOWER }}/${{ inputs.scope }}.tfvars" \
              -out=tfplan
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}-${{ inputs.scope }}
          path: environments/scope/${{ env.SCOPE_DIR }}/tfplan
          retention-days: 1

  apply:
    name: "Terraform Apply (${{ inputs.env }} / ${{ inputs.scope }})"
    needs: plan
    runs-on: ubuntu-latest
    environment: apply

    env:
      ARM_CLIENT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_ID_TERRAFORM', inputs.env)] }}
      ARM_CLIENT_SECRET:   ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_SECRET_TERRAFORM', inputs.env)] }}
      ARM_TENANT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_TENANT_ID_TERRAFORM', inputs.env)] }}
      ARM_SUBSCRIPTION_ID: ${{ secrets[format('SDLC_{0}_AZURE_SUBSCRIPTION_ID_TERRAFORM', inputs.env)] }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Set env vars
        run: |
          echo "ENV_LOWER=$(echo '${{ inputs.env }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          if [ "${{ inputs.scope }}" = "base" ] || [ "${{ inputs.scope }}" = "shared" ]; then
            echo "SCOPE_DIR=${{ inputs.scope }}" >> $GITHUB_ENV
          else
            echo "SCOPE_DIR=dedicated" >> $GITHUB_ENV
          fi

      - name: Terraform Init
        working-directory: environments/scope/${{ env.SCOPE_DIR }}
        run: terraform init -backend-config="key=${{ inputs.scope }}.tfstate"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}-${{ inputs.scope }}
          path: environments/scope/${{ env.SCOPE_DIR }}

      - name: Terraform Apply
        working-directory: environments/scope/${{ env.SCOPE_DIR }}
        run: terraform apply -auto-approve tfplan
